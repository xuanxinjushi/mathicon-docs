site_name: Mathicon
site_description: Mathicon - publication-ready plotting utilities for mathematics and machine learning
site_url: https://mathicon.readthedocs.io/

docs_dir: docs
strict: false

theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: blue grey
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: blue grey
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - What is Mathicon?: what-is-mathicon.md
  - Installation: installation.md
  - Quick start: quickstart.md
  - API reference:
      - Overview: python-api.md
      - Colors: colors.md
      - Matrix visualization: matrix-visualization.md
      - Vector visualization: vector-visualization.md
      - Figure utilities: figure-utilities.md
      - Mindmaps: mindmaps.md
      - Mindmap JSON format: mindmap-json-format.md
      - Posters: posters.md
      - Icon registry: icon-registry.md
      - Icons reference: icons-reference.md
      - CLI tools: cli-tools.md
  - System requirements: system-requirements.md
